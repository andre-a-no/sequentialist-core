[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sequentialist-core"
dynamic = ["version"]
description = "Common layer of the sequentialist libraries: specs, a checkpointed engine over sequential-analysis runs, storage, audit log, reports"
readme = "README.md"
license = "AGPL-3.0-only OR LicenseRef-Commercial"  # see COMMERCIAL.md
license-files = ["LICENSE", "COMMERCIAL.md"]
requires-python = ">=3.8"
authors = [{ name = "Andrej Novikov" }]
maintainers = [{ name = "Novikov Laboratories LLC", email = "andrei@hobukob.ru" }]
keywords = ["sequential analysis", "anytime-valid inference", "audit log", "checkpoint", "reproducibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
# checkpoints (sequential-analysis.checkpoint/2) and procedure identities are part of the stored state:
# a new minor version of sequential-analysis is adopted deliberately
dependencies = ["sequential-analysis>=0.4,<0.5"]

[project.optional-dependencies]
yaml = ["PyYAML>=5.1"]

[project.scripts]
sequentialist = "sequentialist.core.cli:main"

[project.entry-points."sequentialist.commands"]
audit = "sequentialist.core.cli:audit_command"
tasks = "sequentialist.core.cli:tasks_command"

[project.urls]
Source = "https://github.com/andre-a-no/sequentialist-core"
Issues = "https://github.com/andre-a-no/sequentialist-core/issues"
"Commercial license" = "https://github.com/andre-a-no/sequentialist-core/blob/main/COMMERCIAL.md"

[tool.setuptools.dynamic]
version = { attr = "sequentialist.core.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["sequentialist.core*"]
namespaces = true

[tool.setuptools.package-data]
"sequentialist.core" = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Unicode in strings and comments is intentional (Russian text, math)
]

[tool.ruff.lint.isort]
known-first-party = ["sequentialist"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731", "RUF012"]

[tool.mypy]
python_version = "3.10"  # mypy checks types only; the code runs on 3.8 (see CI)
mypy_path = "src"
files = ["src/sequentialist"]
namespace_packages = true
explicit_package_bases = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true

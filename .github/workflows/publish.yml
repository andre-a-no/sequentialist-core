name: publish

# Publishes a release on PyPI by trusted publishing (no token): PyPI accepts the upload because it comes
# from this workflow of andre-a-no/sequentialist-core in the environment "pypi".
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the release to publish, for example v0.1.0"
        required: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: the version of the package is the tag
        run: |
          python - "${TAG#v}" <<'EOF'
          import re
          import sys
          from pathlib import Path
          version = sys.argv[1]
          if not re.fullmatch(r"\d+(\.\d+)*((a|b|rc)\d+)?(\.post\d+)?(\.dev\d+)?", version):
              sys.exit(f"the tag must be v and a version, for example v0.1.2; got {version!r}")
          path = Path("src/sequentialist/core/version.py")
          path.write_text(re.sub(r'__version__ = "[^"]*"', f'__version__ = "{version}"', path.read_text()))
          print(f"publishing version {version}")
          EOF
          grep __version__ src/sequentialist/core/version.py
      - run: python -m pip install build twine && python -m build --outdir dist . && python -m twine check --strict dist/*
      - name: the tests pass on the wheel that is published
        run: |
          python -m venv /tmp/env && /tmp/env/bin/pip install dist/*.whl
          /tmp/env/bin/python -W error::ResourceWarning -m unittest discover -s tests -t .
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/sequentialist-core/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
